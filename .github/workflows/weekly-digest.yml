name: Weekly Deal Radar Digest

on:
  schedule:
    # 9:00 AM IST every Monday = 03:30 UTC (IST is UTC+5:30). GitHub Actions
    # schedules run on a best-effort basis and can be delayed a few minutes
    # during high platform load — treat this as "around 9 AM", not exact.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      no_send:
        description: "Build the digest but skip emailing it"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: store/deal_radar.db
          key: deal-radar-db-${{ github.run_id }}
          restore-keys: deal-radar-db-

      - name: Run weekly digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: |
          python main.py ${{ github.event.inputs.no_send == 'true' && '--no-send' || '' }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: output/digest_latest.html

      - name: Persist database
        uses: actions/cache/save@v4
        with:
          path: store/deal_radar.db
          key: deal-radar-db-${{ github.run_id }}
