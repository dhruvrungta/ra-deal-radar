# RA Deal Radar configuration

schedule:
  # Informational only — the real trigger is the cron in
  # .github/workflows/weekly-digest.yml. Keep these two in sync.
  # 9:00 AM IST every Monday == 03:30 UTC (IST is UTC+5:30)
  cron: "30 3 * * 1"
  timezone: "Asia/Kolkata"

recipients:
  to:
    - "pankaj@rungtaadvisors.com"
    - "itzdhruvrungta@gmail.com"
  # Must match the authenticated Gmail account (or a verified alias) or
  # Gmail will reject/rewrite the From header.
  from_address: "dhruvrungta2007@gmail.com"
  from_name: "RA Deal Radar"
  subject_prefix: "RA Deal Radar"

sources:
  # RSS sources: lowest maintenance, start here.
  rss:
    - name: vccircle
      url: "https://www.vccircle.com/feed"
      # As of 2026-09-16 this endpoint 500s server-side; no working RSS URL
      # found on the site. Re-check and flip to true once it's back.
      enabled: false
    - name: entrackr
      url: "https://entrackr.com/rss"
      enabled: true
    - name: inc42
      url: "https://inc42.com/feed/"
      enabled: true

  # General news sites: HTML scrapers, more brittle than RSS. URLs verified
  # working live on 2026-09-16; selectors live in ingest/sources.py.
  scrape:
    - name: economic_times
      url: "https://economictimes.indiatimes.com/topic/mergers-and-acquisitions"
      enabled: true
    - name: mint
      url: "https://www.livemint.com/companies"
      enabled: true
    - name: business_standard
      url: "https://www.business-standard.com/topic/mergers-acquisitions"
      enabled: true
    - name: moneycontrol
      url: "https://www.moneycontrol.com/deals-and-mergers/"
      enabled: true

  # Regulatory/official sources: structured, higher signal. NSE, CCI and
  # SEBI verified working with a plain HTTP client on 2026-09-16. BSE sits
  # behind Akamai bot-protection that needs real browser JS to pass — stays
  # disabled until/unless that's worth a headless-browser dependency.
  regulatory:
    - name: bse_announcements
      url: "https://www.bseindia.com/corporates/ann.html"
      enabled: false
    - name: nse_announcements
      url: "https://www.nseindia.com/api/corporate-announcements"
      enabled: true
    - name: cci_combinations
      url: "https://www.cci.gov.in/combination/orders-section31"
      enabled: true
    - name: sebi_sast
      url: "https://www.sebi.gov.in/sebiweb/home/HomeAction.do"
      enabled: true

classification:
  # Gemini free tier (Google AI Studio key, no credit card needed) — Flash
  # models only, Pro is paid-only. gemini-2.5-flash/-lite and
  # gemini-flash-latest were deprecated/overloaded as of 2026-09-16;
  # Google's own deprecation error for 2.5-flash pointed here. Used this
  # one to build the real content that actually shipped. Check
  # aistudio.google.com if this one stops working.
  model: "gemini-3.6-flash"
  # 9 sources now produce ~250 articles/week; a bigger batch means fewer
  # requests against the free tier's ~5/min rate limit.
  batch_size: 40
  max_tokens: 12000
  # Seconds to wait between classify calls — paces under the observed
  # ~5 requests/minute free-tier limit so a big run doesn't burn through
  # retries. Bump if Google's actual limit turns out looser than observed.
  min_seconds_between_calls: 13

taxonomy:
  deal_types:
    - ma_strategic
    - pe_buyout
    - pe_growth
    - pe_minority
    - vc
    - pe_exit
  cross_border:
    - domestic
    - inbound
    - outbound
  stages:
    - rumored
    - announced
    - definitive_agreement
    - completed
    - terminated

dedupe:
  # rapidfuzz token_sort_ratio threshold (0-100) for same-week duplicate matching
  same_week_similarity_threshold: 82
  # deal size tolerance (fractional) when comparing two deals as the "same" deal
  deal_size_tolerance_pct: 0.15

database:
  path: "store/deal_radar.db"

digest:
  top_deals_count: 5
  # PE/VC deals below this disclosed size (or with undisclosed size) are
  # dropped from the "PE — Buyouts & Growth" section entirely — keeps that
  # section to substantial deal flow instead of every small seed round.
  pe_vc_min_size_usd_m: 20
  template_path: "digest/template.html"
  output_path: "output/digest_latest.html"
  logo_path: "assets/rungta_logo.png"
  site_url: "https://www.rungtaadvisors.com"
  brand:
    navy: "#363891"
    orange: "#F89A55"
    gray: "#6C7A89"
